
<app-progress *ngIf="mProgress()" />

<c-row ngPreserveWhitespaces>
  <c-col xs="12">
    <c-card class="mb-3">
      <c-card-body>

        <div>
          <form [formGroup]="itemForm" (ngSubmit)="onSubmit(itemForm.value)">
            <div class="mb-3">
              <div class="row">
                <div class="col-md-12">
                  <div class="form-group mb-3">
                    <label for="professional_body_id?" class="col-form-label required">Professional Body:</label>
                    <select formControlName="professional_body_id" [ngClass]="{'is-invalid': itemForm.get('professional_body_id')?.invalid && (itemForm.get('professional_body_id')?.dirty || itemForm.get('professional_body_id')?.touched)}" type="text" class="form-control">
                      <option value="" disabled="true" selected="true">--- Select professional body ---</option>
                      <option *ngFor="let item of mProfessionalBodies" value="{{item.id}}">{{item.name}}</option>
                    </select>
                    <div *ngIf="itemForm.get('professional_body_id')?.invalid && (itemForm.get('professional_body_id')?.dirty || itemForm.get('professional_body_id')?.touched)" class="invalid-feedback" role="alert">
                      <div *ngIf="itemForm.get('professional_body_id')?.errors?.['required']">This field is required.</div>
                    </div>
                  </div>
                </div>
                <div class="col-md-12">
                  <div class="form-group mb-3">
                    <label for="membership_number" class="col-form-label required">Membership Number:</label>
                    <input formControlName="membership_number" [ngClass]="{'is-invalid': itemForm.get('membership_number')?.invalid && (itemForm.get('membership_number')?.dirty || itemForm.get('membership_number')?.touched)}" type="text" class="form-control"/>
                    <div *ngIf="itemForm.get('membership_number')?.invalid && (itemForm.get('membership_number')?.dirty || itemForm.get('membership_number')?.touched)" class="invalid-feedback" role="alert">
                      <div *ngIf="itemForm.get('membership_number')?.errors?.['required']">This field is required.</div>
                    </div>
                  </div>
                </div>
              </div>
              <div class="mt-3 text-right">
                <button routerLink="/dashboard" cButton color="danger">Cancel</button>
                <button [disabled]="itemForm.invalid" type="submit" cButton color="success">Submit</button>
              </div>
            </div>
          </form>
        </div>

      </c-card-body>
    </c-card>
  </c-col>
</c-row>
