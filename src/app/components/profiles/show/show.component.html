
<app-progress *ngIf="mProgress"/>

<c-row ngPreserveWhitespaces>
  <c-col md="4">
    <c-card class="mb-3">
      <c-card-body>
        <div class="text-center mb-3">
          <span class="rounded-circle bg-danger p-4 text-light">
            <svg cIcon name="cilUser" class="display-3"></svg>
          </span>
        </div>
      <div>
        <h3 class="text-center">{{ mCurrentUser?.name }}</h3>
        <p class="text-muted text-center">{{ mCurrentUser?.role.name }}</p>
      </div>
        <ul class="list-group list-group-unbordered mb-3">
            <li class="list-group-item">
                <b>Email: </b><span class="float-right">{{ mCurrentUser?.email }}</span>
            </li>
            <li class="list-group-item">
                <b>Created: </b><span class="float-right">{{ mCurrentUser?.user?.created_at | date }}</span>
            </li>
            <li class="list-group-item">
                <b>Updated: </b><span class="float-right">{{ mCurrentUser?.user?.updated_at | date }}</span>
            </li>
        </ul>
      </c-card-body>
    </c-card>
  </c-col>
  <c-col md="8">
    <c-card class="mb-3">
      <c-card-header>
        <div class="card-title"  cAccordionButton>Profile</div>
      </c-card-header>
      <c-card-body>
        <c-accordion>
          <ul cListGroup>
            <li cListGroupItem>
              <a routerLink="profile" class="btn btn-link">
                Settings
              </a>
            </li>
            <li cListGroupItem>
              <a routerLink="dashboard" class="btn btn-link">
                Dashboard
              </a>
            </li>
            <li cListGroupItem>
              <a href="{{sso_account_url}}/#/account/dashboard" class="btn btn-link"><i class="cil-user"></i>&nbsp;User Account</a>
            </li>
          </ul>
          <div class="py-2 text-end">
            <button (click)="goBack()" cButton color="danger">Cancel</button>
          </div>
        </c-accordion>
      </c-card-body>
    </c-card>
  </c-col>
</c-row>
