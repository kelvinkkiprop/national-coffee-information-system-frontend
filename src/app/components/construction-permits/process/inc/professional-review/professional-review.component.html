
<app-progress *ngIf="mProgress()" />

<div>
  <form [formGroup]="itemForm" (ngSubmit)="onSubmit(itemForm.value)">

  <!-- Architect -->
  <div *ngIf="(mAppContextService.hasRoles([1]) || mAppContextService.hasRoles([11]))">
    <div class="row">
      <div class="col-md-12">
        <div class="form-group mb-3">
          <label for="topographical_survey_review" class="col-form-label required">Topographical Survey Review:</label>
          <ckeditor [editor]="mEditor" [config]="mAppContextService.ckEditorConfig" [(ngModel)]="item.topographical_survey_review" formControlName="topographical_survey_review" [ngClass]="{'is-invalid': itemForm.get('topographical_survey_review').invalid && (itemForm.get('topographical_survey_review').dirty || itemForm.get('topographical_survey_review').touched)}" type="text" class="form-control1"></ckeditor>
          <div *ngIf="itemForm.get('topographical_survey_review').invalid && (itemForm.get('topographical_survey_review').dirty || itemForm.get('topographical_survey_review').touched)" class="invalid-feedback" role="alert">
            <div *ngIf="itemForm.get('topographical_survey_review').errors?.['required']">This field is required.</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- StructuralEngineer -->
  <div>
    <div class="row">
      <div class="col-md-12">
        <div class="form-group mb-3">
          <label for="geotechnical_survey_review" class="col-form-label required">Geotechnical Survey Review:</label>
          <ckeditor [editor]="mEditor" [config]="mAppContextService.ckEditorConfig" [(ngModel)]="item.geotechnical_survey_review" formControlName="geotechnical_survey_review" [ngClass]="{'is-invalid': itemForm.get('geotechnical_survey_review').invalid && (itemForm.get('geotechnical_survey_review').dirty || itemForm.get('geotechnical_survey_review').touched)}" type="text" class="form-control1"></ckeditor>
          <div *ngIf="itemForm.get('geotechnical_survey_review').invalid && (itemForm.get('geotechnical_survey_review').dirty || itemForm.get('geotechnical_survey_review').touched)" class="invalid-feedback" role="alert">
            <div *ngIf="itemForm.get('geotechnical_survey_review').errors?.['required']">This field is required.</div>
          </div>
        </div>
      </div>
    </div>
  </div>


  <!-- ElectricalEngineer -->
  <div>
    <div class="row">
      <div class="col-md-12">
        <div class="form-group mb-3">
          <label for="traffic_management_plan_and_parking_strategy_review" class="col-form-label required">Traffic Management Plan and Parking Strategy Review:</label>
          <ckeditor [editor]="mEditor" [config]="mAppContextService.ckEditorConfig" [(ngModel)]="item.traffic_management_plan_and_parking_strategy_review" formControlName="traffic_management_plan_and_parking_strategy_review" [ngClass]="{'is-invalid': itemForm.get('traffic_management_plan_and_parking_strategy_review').invalid && (itemForm.get('traffic_management_plan_and_parking_strategy_review').dirty || itemForm.get('traffic_management_plan_and_parking_strategy_review').touched)}" type="text" class="form-control1"></ckeditor>
          <div *ngIf="itemForm.get('traffic_management_plan_and_parking_strategy_review').invalid && (itemForm.get('traffic_management_plan_and_parking_strategy_review').dirty || itemForm.get('traffic_management_plan_and_parking_strategy_review').touched)" class="invalid-feedback" role="alert">
            <div *ngIf="itemForm.get('traffic_management_plan_and_parking_strategy_review').errors?.['required']">This field is required.</div>
          </div>
        </div>
      </div>
    </div>
  </div>


  <div class="mt-3 text-right">
    <button routerLink="/construction-permits" cButton color="danger" class="me-2">Cancel</button>
    <button [disabled]="itemForm.invalid" type="submit" cButton color="success">Submit</button>
  </div>

</form>
</div>
