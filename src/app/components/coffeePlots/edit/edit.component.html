
<app-progress *ngIf="mProgress()" />

<c-row ngPreserveWhitespaces>
  <c-col xs="12">
    <c-card class="mb-4 shadow-sm border-0">
      <c-card-body>

        <form [formGroup]="itemForm" (ngSubmit)="onSubmit(itemForm.value)">

          <div class="row">
            <div class="col-md-12">
              <div class="form-group mb-3">
                <label for="owner_id" class="col-form-label required">Owner:</label>
                <select [(ngModel)]="item.owner_id" formControlName="owner_id" [ngClass]="{'is-invalid': itemForm.get('owner_id')?.invalid && (itemForm.get('owner_id')?.dirty || itemForm.get('owner_id')?.touched)}" type="text" class="form-control">
                  <option value="" disabled="true" selected="true">--- Select owner ---</option>
                  <option *ngFor="let item of mUsers" value="{{item.id}}">{{item.name}}</option>
                </select>
                <div *ngIf="itemForm.get('owner_id')?.invalid && (itemForm.get('owner_id')?.dirty || itemForm.get('owner_id')?.touched)" class="invalid-feedback" role="alert">
                  <div *ngIf="itemForm.get('owner_id')?.errors?.['required']">This field is required.</div>
                </div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-group mb-3">
                <label for="size" class="col-form-label required">Size (Hectares):</label>
                <input [(ngModel)]="item.size" formControlName="size" [ngClass]="{'is-invalid': itemForm.get('size').invalid && (itemForm.get('size').dirty || itemForm.get('size').touched)}" type="number" step="0.01" class="form-control"/>
                <div *ngIf="itemForm.get('size').invalid && (itemForm.get('size').dirty || itemForm.get('size').touched)" class="invalid-feedback" role="alert">
                  <div *ngIf="itemForm.get('size').errors?.['required']">This field is required.</div>
                </div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-group mb-3">
                <label for="soil_profile" class="col-form-label required1">Soil Profile:</label>
                <input [(ngModel)]="item.soil_profile" formControlName="soil_profile" [ngClass]="{'is-invalid': itemForm.get('soil_profile').invalid && (itemForm.get('soil_profile').dirty || itemForm.get('soil_profile').touched)}" type="text" class="form-control"/>
                <div *ngIf="itemForm.get('soil_profile').invalid && (itemForm.get('soil_profile').dirty || itemForm.get('soil_profile').touched)" class="invalid-feedback" role="alert">
                  <div *ngIf="itemForm.get('soil_profile').errors?.['required']">This field is required.</div>
                </div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-group mb-3">
                <label for="coffee_species_id" class="col-form-label required">Coffee Species:</label>
                <select [(ngModel)]="item.coffee_species_id" formControlName="coffee_species_id" [ngClass]="{'is-invalid': itemForm.get('coffee_species_id')?.invalid && (itemForm.get('coffee_species_id')?.dirty || itemForm.get('coffee_species_id')?.touched)}" type="text" class="form-control">
                  <option value="" disabled="true" selected="true">--- Select species ---</option>
                  <option *ngFor="let item of mCoffeeSpecies" value="{{item.id}}">{{item.name}}</option>
                </select>
                <div *ngIf="itemForm.get('coffee_species_id')?.invalid && (itemForm.get('coffee_species_id')?.dirty || itemForm.get('coffee_species_id')?.touched)" class="invalid-feedback" role="alert">
                  <div *ngIf="itemForm.get('coffee_species_id')?.errors?.['required']">This field is required.</div>
                </div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-group mb-3">
                <label for="number_of_coffee_trees" class="col-form-label required1">Number of Coffee Trees:</label>
                <input [(ngModel)]="item.number_of_coffee_trees" formControlName="number_of_coffee_trees" [ngClass]="{'is-invalid': itemForm.get('number_of_coffee_trees').invalid && (itemForm.get('number_of_coffee_trees').dirty || itemForm.get('number_of_coffee_trees').touched)}" type="number" class="form-control"/>
                <div *ngIf="itemForm.get('number_of_coffee_trees').invalid && (itemForm.get('number_of_coffee_trees').dirty || itemForm.get('number_of_coffee_trees').touched)" class="invalid-feedback" role="alert">
                  <div *ngIf="itemForm.get('number_of_coffee_trees').errors?.['required']">This field is required.</div>
                </div>
              </div>
            </div>
            <div class="col-md-12">
              <div class="form-group mb-3">
                <label for="cooperative_society_id" class="col-form-label required1">Cooperative Society:</label>
                <select [(ngModel)]="item.cooperative_society_id" formControlName="cooperative_society_id" [ngClass]="{'is-invalid': itemForm.get('cooperative_society_id')?.invalid && (itemForm.get('cooperative_society_id')?.dirty || itemForm.get('cooperative_society_id')?.touched)}" type="text" class="form-control">
                  <option value="" disabled="true" selected="true">--- Select society ---</option>
                  <option *ngFor="let item of mCooperativeSocieties" value="{{item.id}}">{{item.name}}</option>
                </select>
                <div *ngIf="itemForm.get('cooperative_society_id')?.invalid && (itemForm.get('cooperative_society_id')?.dirty || itemForm.get('cooperative_society_id')?.touched)" class="invalid-feedback" role="alert">
                  <div *ngIf="itemForm.get('cooperative_society_id')?.errors?.['required']">This field is required.</div>
                </div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-group mb-3">
                <label for="country_id" class="col-form-label required">Country:</label>
                <select [(ngModel)]="item.country_id" formControlName="country_id" [ngClass]="{'is-invalid': itemForm.get('country_id')?.invalid && (itemForm.get('country_id')?.dirty || itemForm.get('country_id')?.touched)}" type="text" class="form-control">
                  <option value="" disabled="true" selected="true">--- Select country ---</option>
                  <option *ngFor="let item of mCountries" value="{{item.id}}">{{item.name}}</option>
                </select>
                <div *ngIf="itemForm.get('country_id')?.invalid && (itemForm.get('country_id')?.dirty || itemForm.get('country_id')?.touched)" class="invalid-feedback" role="alert">
                  <div *ngIf="itemForm.get('country_id')?.errors?.['required']">This field is required.</div>
                </div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-group mb-3">
                <label for="county_id" class="col-form-label required">County:</label>
                <select [(ngModel)]="item.county_id" formControlName="county_id" [ngClass]="{'is-invalid': itemForm.get('county_id')?.invalid && (itemForm.get('county_id')?.dirty || itemForm.get('county_id')?.touched)}" type="text" class="form-control">
                  <option value="" disabled="true" selected="true">--- Select county ---</option>
                  <option *ngFor="let item of mCounties" value="{{item.id}}">{{item.name}}</option>
                </select>
                <div *ngIf="itemForm.get('county_id')?.invalid && (itemForm.get('county_id')?.dirty || itemForm.get('county_id')?.touched)" class="invalid-feedback" role="alert">
                  <div *ngIf="itemForm.get('county_id')?.errors?.['required']">This field is required.</div>
                </div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-group mb-3">
                <label for="latitude" class="col-form-label required">Latitude:</label>
                <input [(ngModel)]="item.latitude" formControlName="latitude" [ngClass]="{'is-invalid': itemForm.get('latitude').invalid && (itemForm.get('latitude').dirty || itemForm.get('latitude').touched)}" type="number" step="0.01" class="form-control"/>
                <div *ngIf="itemForm.get('latitude').invalid && (itemForm.get('latitude').dirty || itemForm.get('latitude').touched)" class="invalid-feedback" role="alert">
                  <div *ngIf="itemForm.get('latitude').errors?.['required']">This field is required.</div>
                </div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-group mb-3">
                <label for="longitude" class="col-form-label required">Longitude:</label>
                <input [(ngModel)]="item.longitude" formControlName="longitude" [ngClass]="{'is-invalid': itemForm.get('longitude').invalid && (itemForm.get('longitude').dirty || itemForm.get('longitude').touched)}" type="number" step="0.01" class="form-control"/>
                <div *ngIf="itemForm.get('longitude').invalid && (itemForm.get('longitude').dirty || itemForm.get('longitude').touched)" class="invalid-feedback" role="alert">
                  <div *ngIf="itemForm.get('longitude').errors?.['required']">This field is required.</div>
                </div>
              </div>
            </div>
            <div class="col-md-12">
              <div class="form-group mb-3">
                <label for="geo_json_geometry" class="col-form-label required">Geo Geometry/Polygons:</label>
                <textarea [(ngModel)]="item.geo_json_geometry" formControlName="geo_json_geometry" [ngClass]="{'is-invalid': itemForm.get('geo_json_geometry').invalid && (itemForm.get('geo_json_geometry').dirty || itemForm.get('geo_json_geometry').touched)}" class="form-control"></textarea>
                <div *ngIf="itemForm.get('geo_json_geometry').invalid && (itemForm.get('geo_json_geometry').dirty || itemForm.get('geo_json_geometry').touched)" class="invalid-feedback" role="alert">
                  <div *ngIf="itemForm.get('geo_json_geometry').errors?.['required']">This field is required.</div>
                </div>
              </div>
            </div>
          </div>

          <div class="mt-3 text-end">
            <button routerLink="/coffee-plots" type="button" class="btn btn-light">Cancel</button>
            <button [disabled]="itemForm.invalid" type="submit" class="btn btn-warning">Submit</button>
          </div>

        </form>

      </c-card-body>
    </c-card>
  </c-col>
</c-row>
