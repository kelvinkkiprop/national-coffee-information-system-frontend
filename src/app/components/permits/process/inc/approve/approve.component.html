
<app-progress *ngIf="mProgress()" />

<div>
  <form [formGroup]="itemForm" (ngSubmit)="onSubmit(itemForm.value)">
    <div class="row">
      <div class="col-md-12">
        <div class="form-group mb-3">
          <label for="status_id" class="col-form-label required">Status:</label>
          <select formControlName="status_id" [ngClass]="{'is-invalid': itemForm.get('status_id')?.invalid && (itemForm.get('status_id')?.dirty || itemForm.get('status_id')?.touched)}" type="text" class="form-control">
            <option value="" disabled="true" selected="true">--- Select status ---</option>
            <option *ngFor="let item of mNextPreviousStatuses" value="{{item.id}}">{{item.alias }}</option>
          </select>
          <div *ngIf="itemForm.get('status_id')?.invalid && (itemForm.get('status_id')?.dirty || itemForm.get('status_id')?.touched)" class="invalid-feedback" role="alert">
            <div *ngIf="itemForm.get('status_id')?.errors?.['required']">This field is required.</div>
          </div>
        </div>
      </div>
      <div class="col-md-12">
        <div class="form-group mb-3">
          <label for="remarks" class="col-form-label required1">Remarks:</label>
          <textarea formControlName="remarks" [ngClass]="{'is-invalid': itemForm.get('remarks').invalid && (itemForm.get('remarks').dirty || itemForm.get('remarks').touched)}" type="text" class="form-control"></textarea>
          <div *ngIf="itemForm.get('remarks').invalid && (itemForm.get('remarks').dirty || itemForm.get('remarks').touched)" class="invalid-feedback" role="alert">
            <div *ngIf="itemForm.get('remarks').errors?.['required']">This field is required.</div>
          </div>
        </div>
      </div>
    <div *ngIf="itemForm.get('status_id')?.value==5" class="col-md-6">
      <div class="form-group mb-3">
        <label for="date_of_issue" class="col-form-label required">Date of Issue:</label>
        <input formControlName="date_of_issue" [ngClass]="{'is-invalid': itemForm.get('date_of_issue')?.invalid && (itemForm.get('date_of_issue')?.dirty || itemForm.get('date_of_issue')?.touched)}" type="date" class="form-control"/>
        <div *ngIf="itemForm.get('date_of_issue')?.invalid && (itemForm.get('date_of_issue')?.dirty || itemForm.get('date_of_issue')?.touched)" class="invalid-feedback" role="alert">
          <div *ngIf="itemForm.get('date_of_issue')?.errors?.['required']">This field is required.</div>
        </div>
      </div>
    </div>
    <div *ngIf="itemForm.get('status_id')?.value==5" class="col-md-6">
      <div class="form-group mb-3">
        <label for="effective_date" class="col-form-label required">Effective Date:</label>
        <input formControlName="effective_date" [ngClass]="{'is-invalid': itemForm.get('effective_date')?.invalid && (itemForm.get('effective_date')?.dirty || itemForm.get('effective_date')?.touched)}" type="date" class="form-control"/>
        <div *ngIf="itemForm.get('effective_date')?.invalid && (itemForm.get('effective_date')?.dirty || itemForm.get('effective_date')?.touched)" class="invalid-feedback" role="alert">
          <div *ngIf="itemForm.get('effective_date')?.errors?.['required']">This field is required.</div>
        </div>
      </div>
    </div>
    </div>
    <div class="mt-3 text-end">
      <button routerLink="/permits" type="button" cButton color="light" class="me-2">Cancel</button>
      <button [disabled]="itemForm.invalid" type="submit" cButton color="warning">Submit</button>
    </div>
  </form>
</div>
