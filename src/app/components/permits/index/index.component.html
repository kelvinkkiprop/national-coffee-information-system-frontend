
<app-progress *ngIf="mProgress()" />

<c-row ngPreserveWhitespaces>
  <c-col xs="12">
    <c-card class="mb-4 shadow-sm border-0">
      <c-card-header>
        <div class="d-flex justify-content-between align-items-center">
          <div class="card-title">
            <a routerLink="/permits/create" class="btn btn-warning btn-sm text-light1">
              <i class="fa-solid fa-plus-circle" aria-hidden="true"></i> Add
            </a>
          </div>
          <div>
            <form [formGroup]="itemForm" (ngSubmit)="onSearch(itemForm.value)">
              <div class="input-group input-group-sm"  style="width: 150px;">
                <input type="text" formControlName="search_term" [ngClass]="{'is-invalid': search_term.invalid && (search_term.dirty || search_term.touched)}" class="form-control float-right" placeholder="Search">
                <div class="input-group-append">
                  <button type="submit" class="btn btn-success btn-sm">
                    <i class="fa-solid fa-search" aria-hidden="true"></i>
                  </button>
                </div>
                <div *ngIf="search_term.invalid && (search_term.dirty || search_term.touched)" class="invalid-feedback" type="chip">
                  <div *ngIf="search_term.errors?.['required']">This field is required.</div>
                </div>
              </div>
            </form>
          </div>
        </div>
      </c-card-header>
      <c-card-body>

        <div *ngIf="mPermits.length>0; else noItemsTemplate" class="table-responsive">
          <table cTable striped>
            <thead cTableColor="light1">
              <tr>
                <th scope="col">#</th>
                <th scope="col">Number</th>
                <th scope="col">Applicant</th>
                <th scope="col">Type</th>
                <th scope="col">Status</th>
                <th scope="col">Payment</th>
                <th scope="col">Permit</th>
                <th scope="col">Created</th>
                <th scope="col">Action</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let item of mPermits; index as i">
                <td>{{ this.mPageFrom+i }}.</td>
                <td><a routerLink="/permits/show/{{item.id}}" class="text-sm">{{ item.application_number }}</a></td>
                <td>{{ item.user?.name }}</td>
                <td>{{ item.type?.name }}</td>
                <td><span [routerLink]="mAppContextService.hasTypes([1]) ? ['/permits/process', item.id] : null" class="badge rounded-pill" [ngClass]="{'bg-secondary':item.status_id==1,'bg-warning':item.status_id==2, 'bg-dark':item.status_id==3, 'bg-info':item.status_id==4, 'bg-success':item.status_id==5, 'bg-primary':item.status_id==6, 'bg-danger':item.status_id==7}">{{ item?.status?.name }}</span></td>
                <td><span routerLink="/payments/show/{{item.payment_id}}" class="badge rounded-pill" [ngClass]="item.payment?.status_id===1 ? 'bg-danger':'bg-success'">{{ item.payment?.status.name }}</span></td>
                <td>
                  <span *ngIf="(item.status_id==5)">
                    <button (click)="onDownloadPermit(item)" class="btn btn-link btn-sm">Download</button>
                  </span>
                </td>
                <td>{{ item.created_at|date }}</td>
                <td>
                  <div class="text-nowrap">
                    <a routerLink="/permits/show/{{item.id}}" class="btn btn-outline-dark btn-sm me-1"><i class="fa-solid fa-eye" aria-hidden="true"></i></a>
                    <a *ngIf="(mAppContextService.hasRoles([1]) || (item.status_id== 1 || item.status_id== 2))" routerLink="/permits/edit/{{item.id}}" class="btn btn-dark btn-sm me-1"> <i class="fa-solid fa-pencil-alt" aria-hidden="true"></i></a>
                    <button *ngIf="mAppContextService.hasRoles([1])" (click)="onDelete(item)" class="btn btn-danger btn-sm"><i class="fa-solid fa-trash" aria-hidden="true"></i></button>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <div *ngIf="links">
          <ul class="pagination">
            <li *ngFor="let item of links" [ngClass]="{'active': item.active, 'disabled': !item.url}" class="page-item">
              <a class="page-link" (click)="onChangePage(item.url)" [innerHTML]="item.label"></a>
            </li>
          </ul>
        </div>

        <ng-template #noItemsTemplate>
          <p class="p-5 text-center text-muted">No items</p>
        </ng-template>

      </c-card-body>
    </c-card>
  </c-col>
</c-row>
