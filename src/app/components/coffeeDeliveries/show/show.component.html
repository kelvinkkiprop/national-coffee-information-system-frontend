
<app-progress *ngIf="mProgress()" />

<c-row ngPreserveWhitespaces>
  <c-col xs="12">
    <c-card class="mb-4 shadow-sm border-0">
      <c-card-body>

        <div>
          <div class="row">
            <div class="col-md-6">
              <div class="mb-3">
                <label for="investor_id">User:</label>
                <div *ngIf="item.user" class="text-muted">{{ item.user?.name }}</div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="mb-3">
                <label for="investor_id">Farmer:</label>
                <div *ngIf="item.farmer" class="text-muted">{{ item.farmer?.name }}</div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="mb-3">
                <label for="investor_id">Plot:</label>
                <div *ngIf="item.plot" class="text-muted">{{ item.plot?.size }} ha</div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="mb-3">
                <label for="investor_id">Delivery Date:</label>
                <div *ngIf="item.delivery_date" class="text-muted">{{ item.delivery_date | date }}</div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="mb-3">
                <label for="investor_id">Quantity:</label>
                <div *ngIf="item.quantity" class="text-muted">{{ item.quantity }} kg</div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="mb-3">
                <label for="investor_id">Lot:</label>
                <div *ngIf="item.lot" class="text-muted">{{ item.lot?.lot_number }}</div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="mb-3">
                <label for="investor_id">Created At:</label>
                <div *ngIf="item.created_at" class="text-muted">{{ item.created_at | date }}</div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="mb-3">
                <label for="investor_id">Updated At:</label>
                <div *ngIf="item.updated_at" class="text-muted">{{ item.updated_at | date }}</div>
              </div>
            </div>
          </div>
          <div class="mt-3 text-end">
            <button routerLink="/coffee-deliveries" type="button" class="btn btn-light">Cancel</button>
          </div>
        </div>

      </c-card-body>
    </c-card>
  </c-col>
</c-row>
