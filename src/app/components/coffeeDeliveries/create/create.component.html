
<app-progress *ngIf="mProgress()" />

<c-row ngPreserveWhitespaces>
  <c-col xs="12">
    <c-card class="mb-4 shadow-sm border-0">
      <c-card-header>
        <div class="d-flex justify-content-between align-items-center">
          <div class="card-title">
            <h6 class="mb-0">Records coffee delivered by farmers to cooperatives, collection centres or factories here.</h6>
          </div>
        </div>
      </c-card-header>
      <c-card-body>

        <form [formGroup]="itemForm" (ngSubmit)="onSubmit(itemForm.value)">

          <div class="row">
            <div class="col-md-12">
              <div class="form-group mb-3">
                <label for="farmer_id" class="col-form-label required">Farmer:</label>
                <select (change)="onFarmerChange($event.target)" formControlName="farmer_id" [ngClass]="{'is-invalid': itemForm.get('farmer_id')?.invalid && (itemForm.get('farmer_id')?.dirty || itemForm.get('farmer_id')?.touched)}" type="text" class="form-control">
                  <option value="" disabled="true" selected="true">--- Select farmer ---</option>
                  <option *ngFor="let item of mFarmers" value="{{item.id}}">{{item.name}}</option>
                </select>
                <div *ngIf="itemForm.get('farmer_id')?.invalid && (itemForm.get('farmer_id')?.dirty || itemForm.get('farmer_id')?.touched)" class="invalid-feedback" role="alert">
                  <div *ngIf="itemForm.get('farmer_id')?.errors?.['required']">This field is required.</div>
                </div>
              </div>
            </div>
            <div class="col-md-12">
              <div class="form-group mb-3">
                <label for="plot_id" class="col-form-label required">Plot:</label>
                <select formControlName="plot_id" [ngClass]="{'is-invalid': itemForm.get('plot_id')?.invalid && (itemForm.get('plot_id')?.dirty || itemForm.get('plot_id')?.touched)}" type="text" class="form-control">
                  <option value="" disabled="true" selected="true">--- Select plot ---</option>
                  <option *ngFor="let item of mPlots" value="{{item.id}}">{{item.size}} ha</option>
                </select>
                <div *ngIf="itemForm.get('plot_id')?.invalid && (itemForm.get('plot_id')?.dirty || itemForm.get('plot_id')?.touched)" class="invalid-feedback" role="alert">
                  <div *ngIf="itemForm.get('plot_id')?.errors?.['required']">This field is required.</div>
                </div>
              </div>
            </div>
            <div class="col-md-12">
              <div class="form-group mb-3">
                <label for="coffee_species_id" class="col-form-label required">Coffee Species:</label>
                <select formControlName="coffee_species_id" [ngClass]="{'is-invalid': itemForm.get('coffee_species_id')?.invalid && (itemForm.get('coffee_species_id')?.dirty || itemForm.get('coffee_species_id')?.touched)}" type="text" class="form-control">
                  <option value="" disabled="true" selected="true">--- Select species ---</option>
                  <option *ngFor="let item of mCoffeeSpecies" value="{{item.id}}">{{item.name}}</option>
                </select>
                <div *ngIf="itemForm.get('coffee_species_id')?.invalid && (itemForm.get('coffee_species_id')?.dirty || itemForm.get('coffee_species_id')?.touched)" class="invalid-feedback" role="alert">
                  <div *ngIf="itemForm.get('coffee_species_id')?.errors?.['required']">This field is required.</div>
                </div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-group mb-3">
                <label for="delivery_date" class="col-form-label required">Delivery Date:</label>
                <input formControlName="delivery_date" [ngClass]="{'is-invalid': itemForm.get('delivery_date').invalid && (itemForm.get('delivery_date').dirty || itemForm.get('delivery_date').touched)}" type="date" class="form-control"/>
                <div *ngIf="itemForm.get('delivery_date').invalid && (itemForm.get('delivery_date').dirty || itemForm.get('delivery_date').touched)" class="invalid-feedback" role="alert">
                  <div *ngIf="itemForm.get('delivery_date').errors?.['required']">This field is required.</div>
                </div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-group mb-3">
                <label for="quantity" class="col-form-label required">Quantity (Kg):</label>
                <input formControlName="quantity" [ngClass]="{'is-invalid': itemForm.get('quantity').invalid && (itemForm.get('quantity').dirty || itemForm.get('quantity').touched)}" type="number" class="form-control"/>
                <div *ngIf="itemForm.get('quantity').invalid && (itemForm.get('quantity').dirty || itemForm.get('quantity').touched)" class="invalid-feedback" role="alert">
                  <div *ngIf="itemForm.get('quantity').errors?.['required']">This field is required.</div>
                </div>
              </div>
            </div>
          </div>

          <div class="mt-3 text-end">
            <button routerLink="/coffee-deliveries" type="button" class="btn btn-light">Cancel</button>
            <button [disabled]="itemForm.invalid" type="submit" class="btn btn-warning">Submit</button>
          </div>

        </form>

      </c-card-body>
    </c-card>
  </c-col>
</c-row>
