
<app-progress *ngIf="mProgress()" />

<c-row ngPreserveWhitespaces>
  <c-col xs="12">
    <c-card class="mb-4 shadow-sm border-0">
      <c-card-body>

        <div class="row">
          <div class="col-md-12">
              @if (item.pesaflow_invoice_link) {
                <iframe [src]="this.mAppContextService.safeResourceUrl(item.pesaflow_invoice_link)" name="my_iframe" id="my_iframe" width="100%" height="500px" frameborder="0" scrolling=""></iframe>
              }
          </div>
        </div>

      </c-card-body>
    </c-card>
  </c-col>
</c-row>
