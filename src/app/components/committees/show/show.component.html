
<app-progress *ngIf="mProgress()" />

<c-row ngPreserveWhitespaces>
  <c-col xs="12">
    <c-card class="mb-4 shadow-sm border-0">
      <c-card-body>

        <div>
          <div class="row">
            <div class="col-md-6">
              <div class="mb-3">
                <label for="name">Name:</label>
                <div *ngIf="item.name" class="text-muted">{{ item.name }}</div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="mb-3">
                <label for="created_at">Members:</label>
                <div *ngIf="mMembers" class="text-muted">{{ mMembers.length }}</div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="mb-3">
                <label for="created_at">Created At:</label>
                <div *ngIf="item.created_at" class="text-muted">{{ item.created_at | date }}</div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="mb-3">
                <label for="updated_at">Updated At:</label>
                <div *ngIf="item.updated_at" class="text-muted">{{ item.updated_at | date }}</div>
              </div>
            </div>
          </div>
          <div class="col-md-12">
            <fieldset class="border p-4 mb-4">
              <legend class="float-none w-auto"><h6 class="text-bold1">Members</h6></legend>
              <div>
                <form [formGroup]="itemForm" (ngSubmit)="onSubmit(itemForm.value)">
                  <div class="row">
                    <div class="col-md-9">
                      <div class="form-group mb-3">
                        <select formControlName="user_id" [ngClass]="{'is-invalid': itemForm.get('user_id')?.invalid && (itemForm.get('user_id')?.dirty || itemForm.get('user_id')?.touched)}" type="text" class="form-control">
                          <option value="" disabled="true" selected="true">--- Select member ---</option>
                          <option *ngFor="let item of mUsers" value="{{item.id}}">{{item.name}}</option>
                        </select>
                        <div *ngIf="itemForm.get('user_id')?.invalid && (itemForm.get('user_id')?.dirty || itemForm.get('user_id')?.touched)" class="invalid-feedback" role="alert">
                          <div *ngIf="itemForm.get('user_id')?.errors?.['required']">This field is required.</div>
                        </div>
                      </div>
                    </div>
                    <div class="col-md-3">
                      <button [disabled]="itemForm.invalid" type="submit" class="btn btn-warning w-100">Add</button>
                    </div>
                  </div>
                </form>
                <div *ngIf="mMembers.length>0; else noItemsTemplate" class="table-responsive">
                  <table cTable striped>
                    <thead cTableColor="light1">
                      <tr>
                        <th scope="col">#</th>
                        <th scope="col">Name</th>
                        <th scope="col">Joined</th>
                        <th scope="col">Action</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr *ngFor="let mItem of mMembers; index as i">
                        <td>{{ i+1 }}.</td>
                        <td>{{ mItem.user?.name }}</td>
                        <td>{{ mItem.created_at|date }}</td>
                        <td>
                          <div class="text-nowrap">
                            <button (click)="onDelete(mItem)" class="btn btn-danger btn-sm"><i class="fa-solid fa-trash" aria-hidden="true"></i></button>
                          </div>
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>
                <ng-template #noItemsTemplate>
                  <p class="p-5 text-center text-muted">No items</p>
                </ng-template>
              </div>
            </fieldset>
          </div>
          <div class="mt-3 text-end">
            <button routerLink="/committees" type="button" class="btn btn-light">Cancel</button>
          </div>
        </div>

      </c-card-body>
    </c-card>
  </c-col>
</c-row>
