<app-progress *ngIf="mProgress()" />

<div class="row min-vh-100 justify-content-center align-items-center justify-content-center">
  <div class="col-md-8">
    <div class="text-center">
      <img src="assets/images/logo-main.png" height="64"/>
      <h2 class="m-0 fw-bold">Recover password</h2>
      <p class="text-body-secondary">You are one step a way from your new password.</p>
    </div>
    <div>
      <div class="card border-0 rounded-5">
        <div class="card-body p-4">

          <form [formGroup]="itemForm" (ngSubmit)="onSubmit(itemForm.value)">
            <div class="row mb-4 align-items-center justify-content-center">
              <div class="col-9">
                <div>
                  <h6 class="text-uppercase fw-semibold m-0">Welcome</h6>
                  <div class="text-muted m-0">Always keep your credentials private</div>
                </div>
              </div>
              <div class="col-3 text-end">
                <a class="btn btn-outline-link px-0" routerLink="/">
                  <i class="fa-solid fa-arrow-left me-2"></i> Back
                </a>
              </div>
            </div>
            <div class="row">
              <div class="col-md-12">
                <div class="form-group">
                  <label for="password" class="col-form-label required">Password:</label>
                  <div class="input-group">
                    <input formControlName="password" [ngClass]="{'is-invalid': itemForm.get('password')?.invalid && (itemForm.get('password')?.dirty || itemForm.get('password')?.touched)}" type="password" class="form-control"/>
                    <span class="input-group-text"> <i class="fa-solid fa-eye"></i> </span>
                    <div *ngIf="itemForm.get('password')?.invalid && (itemForm.get('password')?.dirty || itemForm.get('password')?.touched)" class="invalid-feedback" role="alert">
                      <div *ngIf="itemForm.get('password')?.errors?.['required']">This field is required.</div>
                    </div>
                  </div>
                </div>
              </div>
              <div class="col-md-12">
                <div class="form-group">
                  <label for="password_confirmation" class="col-form-label required">Confirm Password:</label>
                  <div class="input-group">
                    <input formControlName="password_confirmation" [ngClass]="{'is-invalid': itemForm.get('password_confirmation')?.invalid && (itemForm.get('password_confirmation')?.dirty || itemForm.get('password_confirmation')?.touched)}" type="password" class="form-control"/>
                    <span class="input-group-text"> <i class="fa-solid fa-eye"></i> </span>
                    <div *ngIf="itemForm.get('password_confirmation')?.invalid && (itemForm.get('password_confirmation')?.dirty || itemForm.get('password_confirmation')?.touched)" class="invalid-feedback" role="alert">
                      <div *ngIf="itemForm.get('password_confirmation')?.errors?.['required']">This field is required.</div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div class="mt-3">
              <button type="submit" class="w-100 btn btn-info text-light rounded-pill px-4">
                Update Password
              </button>
            </div>
          </form>

        </div>
      </div>
    </div>
</div>
