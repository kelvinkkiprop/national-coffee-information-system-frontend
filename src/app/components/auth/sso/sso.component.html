<div class="lockscreen-wrapper">
  <div class="lockscreen-item text-center">
    <div class="mb-2">
      <h5 class="lead text-muted">Single Sign-On</h5>
      <p>Proceed as <span class="lockscreen-name">{{name}}</span></p>
    </div>
    <div class="lockscreen-credentials1">
      <button (click)="closePage()" type="button" class="btn btn-danger btn-sm mx-2">No</button>
      <button (click)="confirmLogin()" type="button" class="btn btn-success btn-sm">Yes</button>
    </div>
  </div>
</div>
