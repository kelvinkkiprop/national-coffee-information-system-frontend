<app-progress *ngIf="mProgress()" />

<div class="row min-vh-100 justify-content-center align-items-center justify-content-center">
  <div class="col-md-8">
    <div class="text-center">
      <img src="assets/images/logo-main.png" height="64"/>
      <h2 class="m-0 fw-bold">Forgot password?</h2>
      <p class="text-body-secondary">Here you can easily retrieve a new password</p>
    </div>
    <div>
      <div class="card border-0 rounded-5">
        <div class="card-body p-4">

          <form [formGroup]="itemForm" (ngSubmit)="onSubmit(itemForm.value)">
            <div class="row mb-4 align-items-center justify-content-center">
              <div class="col-9">
                <div>
                  <h6 class="text-uppercase fw-semibold m-0">Welcome</h6>
                  <div class="text-muted m-0">Always keep your credentials private</div>
                </div>
              </div>
              <div class="col-3 text-end">
                <a class="btn btn-outline-link px-0" routerLink="/">
                  <i class="fa-solid fa-arrow-left me-2"></i> Back
                </a>
              </div>
            </div>
            <div class="row">
              <div class="col-md-12">
                <div class="form-group mb-3">
                  <label for="email" class="col-form-label required">Email:</label>
                  <input formControlName="email" [ngClass]="{'is-invalid': itemForm.get('email')?.invalid && (itemForm.get('email')?.dirty || itemForm.get('email')?.touched)}" type="email" class="form-control"/>
                  <div *ngIf="itemForm.get('email')?.invalid && (itemForm.get('email')?.dirty || itemForm.get('email')?.touched)" class="invalid-feedback" role="alert">
                    <div *ngIf="itemForm.get('email')?.errors?.['required']">This field is required.</div>
                  </div>
                </div>
              </div>
            </div>
            <div class="mt-3">
              <button type="submit" class="w-100 btn btn-info text-light rounded-pill px-4">
                Reset
              </button>
            </div>
          </form>

        </div>
      </div>
    </div>
</div>
