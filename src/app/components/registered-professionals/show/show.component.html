
<app-progress *ngIf="mProgress()" />

<c-row ngPreserveWhitespaces>
  <c-col xs="12">
    <c-card class="mb-3">
      <c-card-body>

        <div>

          <div class="row">
            <div class="col-md-6">
              <div class="mb-3">
                <label for="investor_id">Name:</label>
                <div *ngIf="item.consultant_name" class="text-muted">{{ item.consultant_name }}</div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="mb-3">
                <label for="investor_id">Professional Body:</label>
                <div *ngIf="item.professional_body" class="text-muted">{{ item.professional_body?.name }}</div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="mb-3">
                <label for="investor_id">Membership Number:</label>
                <div *ngIf="item.membership_number" class="text-muted">{{ item.membership_number }}</div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="mb-3">
                <label for="investor_id">Email:</label>
                <div *ngIf="item.email" class="text-muted">{{ item.email }}</div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="mb-3">
                <label for="investor_id">Status:</label>
                <div *ngIf="item.status" class="text-muted">{{ item.status }}</div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="mb-3">
                <label for="investor_id">Postal Address:</label>
                <div *ngIf="item.postal_address" class="text-muted">{{ item.postal_address }}</div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="mb-3">
                <label for="investor_id">Qualification:</label>
                <div *ngIf="item.qualification" class="text-muted">{{ item.qualification }}</div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="mb-3">
                <label for="investor_id">Business Name:</label>
                <div *ngIf="item.business_name" class="text-muted">{{ item.business_name }}</div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="mb-3">
                <label for="investor_id">Nationality:</label>
                <div *ngIf="item.nationality" class="text-muted">{{ item.nationality }}</div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="mb-3">
                <label for="investor_id">Subscription Year:</label>
                <div *ngIf="item.subscription_year" class="text-muted">{{ item.subscription_year }}</div>
              </div>
            </div>
            <div class="col-md-12">
              <div class="mb-3">
                <label for="investor_id">Good Standing:</label>
                <div *ngIf="item.good_standing" class="text-muted">{{ item.good_standing }}</div>
              </div>
            </div>
          </div>

          <div class="mt-3 text-right">
            <button routerLink="/registered-professionals" cButton color="danger">Cancel</button>
          </div>

        </div>

      </c-card-body>
    </c-card>
  </c-col>
</c-row>
