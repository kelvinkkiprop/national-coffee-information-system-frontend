<div ngPreserveWhitespaces>

  <div class="card mb-4 shadow-sm border-0">

    <div class="card-body">
      <div class="text-center mb-3">
        <span class="rounded-circle bg-danger text-light d-inline-flex align-items-center justify-content-center" style="width:86px; height:86px;" >
          <i class="fa fa-user fa-3x" aria-hidden="true"></i>
        </span>
      </div>
      <div>
        <h4 class="text-center">{{ mCurrentUser?.name }}</h4>
        <p class="text-muted text-center">{{ mCurrentUser?.role?.name || ''  }}</p>
      </div>
      <ul class="list-group list-group-unbordered mb-3">
        <li class="list-group-item d-flex justify-content-between align-items-center">
          <b>Status:</b><span class="badge rounded-pill" [ngClass]="mCurrentUser?.status_id===1 ? 'bg-info':'bg-danger'">{{ mCurrentUser?.status?.name || '-' }}</span>
        </li>
        <li class="list-group-item d-flex justify-content-between align-items-center">
          <b>Email:</b><span class="text-end">{{ mCurrentUser?.email }}</span>
        </li>
        <li class="list-group-item d-flex justify-content-between align-items-center">
          <b>Joined:</b><span class="float-right">{{ mCurrentUser?.created_at | date }}</span>
        </li>
      </ul>
    </div>

  </div>

</div>
