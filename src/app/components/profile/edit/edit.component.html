
<app-progress *ngIf="mProgress()" />

<div class="row" ngPreserveWhitespaces>
  <div class="col-md-12">
    <div appAnimations="animate-fade-in-left" class="card mb-4 shadow-sm border-0">

      <div class="card-header">
        <div class="card-title">Update Profile</div>
      </div>

      <div class="card-body">
        <form [formGroup]="itemForm" (ngSubmit)="onSubmit(itemForm.value)">
          <div class="mb-3">
            <div class="row">
              <div class="col-md-12">
                <div class="form-group mb-3">
                  <label for="password" class="col-form-label required">Password:</label>
                  <div class="input-group">
                    <input formControlName="password" [ngClass]="{'is-invalid': itemForm.get('password')?.invalid && (itemForm.get('password')?.dirty || itemForm.get('password')?.touched)}" [type]="mShowPassword ? 'text':'password'" class="form-control"/>
                    <span class="input-group-text" role="button" (click)="mShowPassword = !mShowPassword" [attr.aria-label]="mShowPassword ? 'Hide password':'Show password'" style="cursor: pointer;"> <i [class]="mShowPassword ? 'fa-solid fa-eye-slash':'fa-solid fa-eye'"></i></span>
                    <div *ngIf="itemForm.get('password')?.invalid && (itemForm.get('password')?.dirty || itemForm.get('password')?.touched)" class="invalid-feedback" role="alert">
                      <div *ngIf="itemForm.get('password')?.errors?.['required']">This field is required.</div>
                    </div>
                  </div>
                </div>
              </div>
              <div class="col-md-12">
                <div class="form-group mb-3">
                  <label for="password_confirmation" class="col-form-label required">Confirm Password:</label>
                  <div class="input-group">
                    <input formControlName="password_confirmation" [ngClass]="{'is-invalid': itemForm.get('password_confirmation')?.invalid && (itemForm.get('password_confirmation')?.dirty || itemForm.get('password_confirmation')?.touched)}" [type]="mShowPasswordConfirmation ? 'text':'password'" class="form-control"/>
                    <span class="input-group-text" role="button" (click)="mShowPasswordConfirmation = !mShowPasswordConfirmation" [attr.aria-label]="mShowPasswordConfirmation ? 'Hide password_confirmation':'Show password_confirmation'" style="cursor: pointer;"> <i [class]="mShowPasswordConfirmation ? 'fa-solid fa-eye-slash':'fa-solid fa-eye'"></i></span>
                    <div *ngIf="itemForm.get('password_confirmation')?.invalid && (itemForm.get('password_confirmation')?.dirty || itemForm.get('password_confirmation')?.touched)" class="invalid-feedback" role="alert">
                      <div *ngIf="itemForm.get('password_confirmation')?.errors?.['required']">This field is required.</div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div class="mt-3 text-end">
              <button (click)="goBack()" type="button" class="btn btn-light me-2">Cancel</button>
              <button [disabled]="itemForm.invalid" type="submit" class="btn btn-warning">Submit</button>
            </div>
          </div>
        </form>
      </div>

    </div>
  </div>
</div>
