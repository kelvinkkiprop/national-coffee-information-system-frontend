<app-progress *ngIf="mProgress()" />

<c-row ngPreserveWhitespaces>
  <c-col xs="12">
    <c-card class="mb-4 shadow-sm border-0">
      <c-card-body>

        <form [formGroup]="itemForm" (ngSubmit)="onSubmit(itemForm.value)">

          <fieldset class="border p-4 mb-4">
            <legend  class="float-none w-auto"><h6 class="text-bold1">Basic Information</h6></legend>
            <div class="row">
              <div class="col-md-12">
                <div class="form-group mb-3">
                  <label for="role_id" class="col-form-label required">Legal Status:</label>
                  <select [(ngModel)]="item.user.role_id" formControlName="role_id" [ngClass]="{'is-invalid': itemForm.get('role_id')?.invalid && (itemForm.get('role_id')?.dirty || itemForm.get('role_id')?.touched)}" type="text" class="form-control">
                    <option value="" disabled="true" selected="true">--- Select role ---</option>
                    <option *ngFor="let item of mRoles" value="{{item.id}}">{{item.name}}</option>
                  </select>
                  <div *ngIf="itemForm.get('role_id')?.invalid && (itemForm.get('role_id')?.dirty || itemForm.get('role_id')?.touched)" class="invalid-feedback" role="alert">
                    <div *ngIf="itemForm.get('role_id')?.errors?.['required']">This field is required.</div>
                  </div>
                </div>
              </div>
               <div class="col-md-6">
                <div class="form-group mb-3">
                  <label for="id_number" class="col-form-label required">ID Number:</label>
                  <input [(ngModel)]="item.id_number" formControlName="id_number" [ngClass]="{'is-invalid': itemForm.get('id_number').invalid && (itemForm.get('id_number').dirty || itemForm.get('id_number').touched)}" type="text" class="form-control"/>
                  <div *ngIf="itemForm.get('id_number').invalid && (itemForm.get('id_number').dirty || itemForm.get('id_number').touched)" class="invalid-feedback" role="alert">
                    <div *ngIf="itemForm.get('id_number').errors?.['required']">This field is required.</div>
                  </div>
                </div>
              </div>
              <div class="col-md-6">
                <div class="form-group mb-3">
                  <label for="phone_number" class="col-form-label required">Phone Number:</label>
                  <input [(ngModel)]="item.phone_number" formControlName="phone_number" [ngClass]="{'is-invalid': itemForm.get('phone_number').invalid && (itemForm.get('phone_number').dirty || itemForm.get('phone_number').touched)}" type="text" class="form-control"/>
                  <div *ngIf="itemForm.get('phone_number').invalid && (itemForm.get('phone_number').dirty || itemForm.get('phone_number').touched)" class="invalid-feedback" role="alert">
                    <div *ngIf="itemForm.get('phone_number').errors?.['required']">This field is required.</div>
                  </div>
                </div>
              </div>
              <div class="col-md-12">
                <div class="form-group mb-3">
                  <label for="country_id" class="col-form-label required">Country:</label>
                  <select [(ngModel)]="item.country_id"  formControlName="country_id" [ngClass]="{'is-invalid': itemForm.get('country_id')?.invalid && (itemForm.get('country_id')?.dirty || itemForm.get('country_id')?.touched)}" type="text" class="form-control">
                    <option value="" disabled="true" selected="true">--- Select country ---</option>
                    <option *ngFor="let item of mCountries" value="{{item.id}}">{{item.name}}</option>
                  </select>
                  <div *ngIf="itemForm.get('country_id')?.invalid && (itemForm.get('country_id')?.dirty || itemForm.get('country_id')?.touched)" class="invalid-feedback" role="alert">
                    <div *ngIf="itemForm.get('country_id')?.errors?.['required']">This field is required.</div>
                  </div>
                </div>
              </div>
            </div>
          </fieldset>

          <fieldset class="border p-4 mb-4">
            <legend  class="float-none w-auto"><h6 class="text-bold1">Location Details</h6></legend>
            <div class="row">
              <div class="col-md-6">
                <div class="form-group mb-3">
                  <label for="county_id" class="col-form-label required1">County:</label>
                  <select [(ngModel)]="item.county_id" (change)="onCountyChange($event.target)" formControlName="county_id" [ngClass]="{'is-invalid': itemForm.get('county_id')?.invalid && (itemForm.get('county_id')?.dirty || itemForm.get('county_id')?.touched)}" type="text" class="form-control">
                    <option value="" disabled="true" selected="true">--- Select county ---</option>
                    <option *ngFor="let item of mCounties" value="{{item.id}}">{{item.name}}</option>
                  </select>
                  <div *ngIf="itemForm.get('county_id')?.invalid && (itemForm.get('county_id')?.dirty || itemForm.get('county_id')?.touched)" class="invalid-feedback" role="alert">
                    <div *ngIf="itemForm.get('county_id')?.errors?.['required']">This field is required.</div>
                  </div>
                </div>
              </div>
              <div class="col-md-6">
                <div class="form-group mb-3">
                  <label for="sub_county_id" class="col-form-label required1">Sub-County:</label>
                  <select [(ngModel)]="item.sub_county_id" (change)="onSubCountyChange($event.target)" formControlName="sub_county_id" [ngClass]="{'is-invalid': itemForm.get('sub_county_id')?.invalid && (itemForm.get('sub_county_id')?.dirty || itemForm.get('sub_county_id')?.touched)}" type="text" class="form-control">
                    <option value="" disabled="true" selected="true">--- Select sub-county ---</option>
                    <option *ngFor="let item of mSubCounties" value="{{item.id}}">{{item.name}}</option>
                  </select>
                  <div *ngIf="itemForm.get('sub_county_id')?.invalid && (itemForm.get('sub_county_id')?.dirty || itemForm.get('sub_county_id')?.touched)" class="invalid-feedback" role="alert">
                    <div *ngIf="itemForm.get('sub_county_id')?.errors?.['required']">This field is required.</div>
                  </div>
                </div>
              </div>
              <div class="col-md-12">
                <div class="form-group mb-3">
                  <label for="ward_id" class="col-form-label required1">Ward:</label>
                  <select [(ngModel)]="item.ward_id" formControlName="ward_id" [ngClass]="{'is-invalid': itemForm.get('ward_id')?.invalid && (itemForm.get('ward_id')?.dirty || itemForm.get('ward_id')?.touched)}" type="text" class="form-control">
                    <option value="" disabled="true" selected="true">--- Select ward ---</option>
                    <option *ngFor="let item of mWards" value="{{item.id}}">{{item.name}}</option>
                  </select>
                  <div *ngIf="itemForm.get('ward_id')?.invalid && (itemForm.get('ward_id')?.dirty || itemForm.get('ward_id')?.touched)" class="invalid-feedback" role="alert">
                    <div *ngIf="itemForm.get('ward_id')?.errors?.['required']">This field is required.</div>
                  </div>
                </div>
              </div>
              <div class="col-md-6">
                <div class="form-group mb-3">
                  <label for="postal_address" class="col-form-label required">Postal Address:</label>
                  <textarea [(ngModel)]="item.postal_address" formControlName="postal_address" [ngClass]="{'is-invalid': itemForm.get('postal_address').invalid && (itemForm.get('postal_address').dirty || itemForm.get('postal_address').touched)}" type="text" class="form-control"></textarea>
                  <div *ngIf="itemForm.get('postal_address').invalid && (itemForm.get('postal_address').dirty || itemForm.get('postal_address').touched)" class="invalid-feedback" role="alert">
                    <div *ngIf="itemForm.get('postal_address').errors?.['required']">This field is required.</div>
                  </div>
                </div>
              </div>
              <div class="col-md-6">
                <div class="form-group mb-3">
                  <label for="physical_address" class="col-form-label required">Physical Address:</label>
                  <textarea [(ngModel)]="item.physical_address" formControlName="physical_address" [ngClass]="{'is-invalid': itemForm.get('physical_address').invalid && (itemForm.get('physical_address').dirty || itemForm.get('physical_address').touched)}" type="text" class="form-control"></textarea>
                  <div *ngIf="itemForm.get('physical_address').invalid && (itemForm.get('physical_address').dirty || itemForm.get('physical_address').touched)" class="invalid-feedback" role="alert">
                    <div *ngIf="itemForm.get('physical_address').errors?.['required']">This field is required.</div>
                  </div>
                </div>
              </div>
            </div>
          </fieldset>
          <div class="mt-3 text-end">
            <a routerLink="/profile" class="btn btn-light">Cancel</a>
            <button [disabled]="itemForm.invalid" type="submit" class="btn btn-warning">Submit</button>
          </div>

        </form>

      </c-card-body>
    </c-card>
  </c-col>
</c-row>
