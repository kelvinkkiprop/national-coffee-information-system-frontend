
<app-progress *ngIf="mProgress()" />

<c-row ngPreserveWhitespaces>
  <c-col xs="12">
    <c-card class="mb-4 shadow-sm border-0">
      <c-card-body>

        <div>
          <div class="row">
            <div class="col-md-6">
              <div class="mb-3">
                <label for="investor_id">Name:</label>
                <div *ngIf="item.name" class="text-muted">{{ item.name }}</div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="mb-3">
                <label for="investor_id">Type:</label>
                <div *ngIf="item.type" class="text-muted">{{ item.type?.name }}</div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="mb-3">
                <label for="investor_id">Created At:</label>
                <div *ngIf="item.created_at" class="text-muted">{{ item.created_at | date }}</div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="mb-3">
                <label for="investor_id">Updated At:</label>
                <div *ngIf="item.updated_at" class="text-muted">{{ item.updated_at | date }}</div>
              </div>
            </div>
          </div>
          <div class="mt-3 text-end">
            <button routerLink="/roles" cButton color="light">Cancel</button>
          </div>
        </div>

      </c-card-body>
    </c-card>
  </c-col>
</c-row>
