
<app-progress *ngIf="mProgress()" />

<c-row ngPreserveWhitespaces>
  <c-col xs="12">
    <c-card class="mb-4 shadow-sm border-0">
      <c-card-body>

        <form [formGroup]="itemForm" (ngSubmit)="onSubmit(itemForm.value)">
          <div class="row">
            <div class="col-md-12">
              <div class="form-group mb-3">
                <label for="user_id" class="col-form-label required">User:</label>
                <select formControlName="user_id" [ngClass]="{'is-invalid': itemForm.get('user_id')?.invalid && (itemForm.get('user_id')?.dirty || itemForm.get('user_id')?.touched)}" type="text" class="form-control">
                  <option value="" disabled="true" selected="true">--- Select user ---</option>
                  <option *ngFor="let item of mUsers" value="{{item.id}}">{{item.name}}</option>
                </select>
                <div *ngIf="itemForm.get('user_id')?.invalid && (itemForm.get('user_id')?.dirty || itemForm.get('user_id')?.touched)" class="invalid-feedback" role="alert">
                  <div *ngIf="itemForm.get('user_id')?.errors?.['required']">This field is required.</div>
                </div>
              </div>
            </div>
            <div class="col-md-12">
              <div class="form-group mb-3">
                <label for="brief_company_profile" class="col-form-label required">Brief Company Profile:</label>
                <textarea formControlName="brief_company_profile" [ngClass]="{'is-invalid': itemForm.get('brief_company_profile').invalid && (itemForm.get('brief_company_profile').dirty || itemForm.get('brief_company_profile').touched)}" type="date" class="form-control"></textarea>
                <div *ngIf="itemForm.get('brief_company_profile').invalid && (itemForm.get('brief_company_profile').dirty || itemForm.get('brief_company_profile').touched)" class="invalid-feedback" role="alert">
                  <div *ngIf="itemForm.get('brief_company_profile').errors?.['required']">This field is required.</div>
                </div>
              </div>
            </div>
            <div class="col-md-12">
              <div class="form-group mb-3">
                <label for="directors_of_dealership" class="col-form-label required">Directors of Dealership (Names and ID/Passport Numbers):</label>
                <textarea formControlName="directors_of_dealership" [ngClass]="{'is-invalid': itemForm.get('directors_of_dealership').invalid && (itemForm.get('directors_of_dealership').dirty || itemForm.get('directors_of_dealership').touched)}" type="date" class="form-control"></textarea>
                <div *ngIf="itemForm.get('directors_of_dealership').invalid && (itemForm.get('directors_of_dealership').dirty || itemForm.get('directors_of_dealership').touched)" class="invalid-feedback" role="alert">
                  <div *ngIf="itemForm.get('directors_of_dealership').errors?.['required']">This field is required.</div>
                </div>
              </div>
            </div>
            <div class="col-md-12">
              <div class="form-group mb-3">
                <label class="col-form-label required">
                  Dealership/Service Types:
                </label>
                <div class="row container">
                  <div *ngFor="let item of mDealershipCategories" class="col-md-4 form-check">
                    <input class="form-check-input" type="checkbox" [id]="'category_' + item.id" [checked]="mSelectedCategories.includes(+item.id)" (change)="onCategoryChange(+item.id, $event)"/>
                    <label class="form-check-label" [for]="'category_'+item.id">{{ item.name }}</label>
                  </div>
                </div>
              </div>
            </div>
            <div class="col-md-12">
              <div class="form-group mb-3">
                <label for="engaged_persons_professional_skills" class="col-form-label required">Engaged Persons Professional Skills (Attach profiles of warehouseman, liquorer, agronomist, engineer, if other professional specify):</label>
                <input (change)="onEngagedPersonsProfessionalSkillsChange($event)" formControlName="engaged_persons_professional_skills" [ngClass]="{'is-invalid': itemForm.get('engaged_persons_professional_skills').invalid && (itemForm.get('engaged_persons_professional_skills').dirty || itemForm.get('engaged_persons_professional_skills').touched)}" type="file" class="form-control"/>
                <div *ngIf="itemForm.get('engaged_persons_professional_skills').invalid && (itemForm.get('engaged_persons_professional_skills').dirty || itemForm.get('engaged_persons_professional_skills').touched)" class="invalid-feedback" role="alert">
                  <div *ngIf="itemForm.get('engaged_persons_professional_skills').errors?.['required']">This field is required.</div>
                </div>
              </div>
            </div>
          </div>
          <div class="mt-3 text-end">
            <button routerLink="/dealer-registrations" type="button" class="btn btn-light">Cancel</button>
            <button [disabled]="itemForm.invalid" type="submit" class="btn btn-warning">Submit</button>
          </div>
        </form>

      </c-card-body>
    </c-card>
  </c-col>
</c-row>
