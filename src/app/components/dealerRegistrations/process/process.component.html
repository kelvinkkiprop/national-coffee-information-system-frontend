
<app-progress *ngIf="mProgress()" />

<c-row ngPreserveWhitespaces>
  <c-col xs="12">
    <c-card class="mb-4 shadow-sm border-0">
      <c-card-body>

        <div class="row">
          <div class="col-md-6">
            <div class="mb-3">
              <label for="name">Number:</label>
              <div *ngIf="item.id" class="text-muted">{{ item.id }}</div>
            </div>
          </div>
          <div class="col-md-6">
            <div class="mb-3">
              <label for="name">Applicant:</label>
              <div *ngIf="item.id" class="text-muted">
                <a routerLink="/users/show/{{item.id}}" class="text-sm">{{ item.name }}</a>
              </div>
            </div>
          </div>
          <div class="col-md-12">
            <div class="mb-3">

              <fieldset class="border p-2 mb-3">
                <legend class="float-none w-auto"><h6 class="fw-bold text-muted">Process</h6></legend>
                <!-- Compliance -->
                <div *ngIf="(item?.dealer_registration_status_id===3 && (mAppContextService.hasRoles([1]) || mAppContextService.hasRoles([2])))">
                  <app-review/>
                </div>
              </fieldset>

            </div>
          </div>
        </div>

      </c-card-body>
    </c-card>
  </c-col>
</c-row>
