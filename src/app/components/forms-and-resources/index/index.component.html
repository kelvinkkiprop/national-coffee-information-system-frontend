<c-row ngPreserveWhitespaces>
  <c-col xs="12">
    <c-card class="mb-4 shadow-sm border-0">
      <c-card-header>
      </c-card-header>
      <c-card-body>

        <div class="row">
          <div class="col-md-12">
            <div class="card mb-4">
              <div class="card-header">
                <div class="card-title text-muted"><strong>Forms</strong></div>
              </div>
              <div class="card-body">
                <div class="mb-3">
                  <div *ngIf="mForms.length>0; else noItemsTemplate">
                    <div class="row">
                      <div *ngFor="let item of mForms" class="col-md-4 mb-3">
                        <div class="card shadow-sm h-100">
                          <div class="card-body text-center">
                            <div class="text-warning fa-2x">
                              <i class="fa-solid fa-folder" aria-hidden="true"></i>
                            </div>
                            <div class="text-bold">{{item.name}}</div>
                            <div>
                              <button (click)="onDownload(item.type_id, item.filename)" class="btn btn-light btn-sm">View</button>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                  <ng-template #noItemsTemplate>
                    <p class="p-5 text-center text-muted">No items</p>
                  </ng-template>
                </div>
              </div>
            </div>
          </div>
          <div class="col-md-12">
            <div class="card mb-4">
              <div class="card-header">
                <div class="card-title text-muted"><strong>Other Resources</strong></div>
              </div>
              <div class="card-body">
                <div class="mb-3">
                  <div *ngIf="mOtherResources.length>0; else noItemsTemplate">
                    <div class="row">
                      <div *ngFor="let item of mOtherResources" class="col-md-4 mb-3">
                        <div class="card shadow-sm h-100">
                          <div class="card-body text-center">
                            <div class="text-warning fa-2x">
                              <i class="fa-solid fa-folder-open" aria-hidden="true"></i>
                            </div>
                            <div class="text-bold">{{item.name}}</div>
                            <div>
                              <button (click)="onDownload(item.type_id, item.filename)" class="btn btn-light btn-sm">Show</button>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                  <ng-template #noItemsTemplate>
                    <p class="p-5 text-center text-muted">No items</p>
                  </ng-template>
                </div>
              </div>
            </div>
          </div>
        </div>

      </c-card-body>
    </c-card>
  </c-col>
</c-row>
