
<app-progress *ngIf="mProgress()" />

<c-row ngPreserveWhitespaces>
  <c-col xs="12">
    <c-card class="mb-4 shadow-sm border-0">
      <c-card-body>

        <form [formGroup]="itemForm" (ngSubmit)="onSubmit(itemForm.value)">
          <div class="row">
            <div class="col-md-12">
              <div class="form-group mb-3">
                <label for="name" class="col-form-label required">Name:</label>
                <input [(ngModel)]="item.name" formControlName="name" [ngClass]="{'is-invalid': itemForm.get('name').invalid && (itemForm.get('name').dirty || itemForm.get('name').touched)}" type="text" class="form-control"/>
                <div *ngIf="itemForm.get('name').invalid && (itemForm.get('name').dirty || itemForm.get('name').touched)" class="invalid-feedback" role="alert">
                  <div *ngIf="itemForm.get('name').errors?.['required']">This field is required.</div>
                </div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-group mb-3">
                <label for="email" class="col-form-label required">Email:</label>
                <input [(ngModel)]="item.email" formControlName="email" [ngClass]="{'is-invalid': itemForm.get('email').invalid && (itemForm.get('email').dirty || itemForm.get('email').touched)}" type="email" class="form-control"/>
                <div *ngIf="itemForm.get('email').invalid && (itemForm.get('email').dirty || itemForm.get('email').touched)" class="invalid-feedback" role="alert">
                  <div *ngIf="itemForm.get('email').errors?.['required']">This field is required.</div>
                </div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-group mb-3">
                <label for="role_id" class="col-form-label required">Role:</label>
                <select [(ngModel)]="item.role_id" formControlName="role_id" [ngClass]="{'is-invalid': itemForm.get('role_id')?.invalid && (itemForm.get('role_id')?.dirty || itemForm.get('role_id')?.touched)}" type="text" class="form-control">
                  <option value="" disabled="true" selected="true">--- Select role ---</option>
                  <option *ngFor="let item of mRoles" value="{{item.id}}">{{item.name}}</option>
                </select>
                <div *ngIf="itemForm.get('role_id')?.invalid && (itemForm.get('role_id')?.dirty || itemForm.get('role_id')?.touched)" class="invalid-feedback" role="alert">
                  <div *ngIf="itemForm.get('role_id')?.errors?.['required']">This field is required.</div>
                </div>
              </div>
            </div>
            <div class="col-md-12">
              <div class="form-group mb-3">
                <label for="status_id" class="col-form-label required">Status:</label>
                <select [(ngModel)]="item.status_id" formControlName="status_id" [ngClass]="{'is-invalid': itemForm.get('status_id')?.invalid && (itemForm.get('status_id')?.dirty || itemForm.get('status_id')?.touched)}" type="text" class="form-control">
                  <option value="" disabled="true" selected="true">--- Select status ---</option>
                  <option *ngFor="let item of mUserStatuses" value="{{item.id}}">{{item.name}}</option>
                </select>
                <div *ngIf="itemForm.get('status_id')?.invalid && (itemForm.get('status_id')?.dirty || itemForm.get('status_id')?.touched)" class="invalid-feedback" role="alert">
                  <div *ngIf="itemForm.get('status_id')?.errors?.['required']">This field is required.</div>
                </div>
              </div>
            </div>
            <div class="col-md-12">
              <div class="form-group mb-3">
                <label for="password" class="col-form-label required">Password:</label>
                <div class="input-group">
                  <input [(ngModel)]="item.password" formControlName="password" [ngClass]="{'is-invalid': itemForm.get('password')?.invalid && (itemForm.get('password')?.dirty || itemForm.get('password')?.touched)}" [type]="mShowPassword ? 'text':'password'" class="form-control"/>
                  <span class="input-group-text" role="button" (click)="mShowPassword = !mShowPassword" [attr.aria-label]="mShowPassword ? 'Hide password':'Show password'" style="cursor: pointer;"> <i [class]="mShowPassword ? 'fa-solid fa-eye-slash':'fa-solid fa-eye'"></i></span>
                  <div *ngIf="itemForm.get('password')?.invalid && (itemForm.get('password')?.dirty || itemForm.get('password')?.touched)" class="invalid-feedback" role="alert">
                    <div *ngIf="itemForm.get('password')?.errors?.['required']">This field is required.</div>
                  </div>
                </div>
              </div>
            </div>
            <div class="col-md-12">
              <div class="icheck-success text-end mb-3">
                <input formControlName="reset_password" [ngClass]="{'is-invalid': itemForm.get('reset_password').invalid && (itemForm.get('reset_password').dirty || itemForm.get('reset_password').touched)}" type="checkbox"/>&nbsp;
                <label for="reset_password">Reset password?</label>
                <div *ngIf="itemForm.get('reset_password').invalid && (itemForm.get('reset_password').dirty || itemForm.get('reset_password').touched)" class="invalid-feedback" role="alert">
                  <div *ngIf="itemForm.get('reset_password').errors?.['required']">This field is required.</div>
                </div>
              </div>
            </div>
          </div>
          <div class="mt-3 text-end">
            <button routerLink="/users" type="button" class="btn btn-light">Cancel</button>
            <button [disabled]="itemForm.invalid" type="submit" class="btn btn-warning">Submit</button>
          </div>
        </form>

      </c-card-body>
    </c-card>
  </c-col>
</c-row>
