
<app-progress *ngIf="mProgress()" />

<c-row ngPreserveWhitespaces>
  <c-col xs="12">
    <c-card class="mb-4 shadow-sm border-0">
      <c-card-body>

        <div>
          <div class="row">
            <div class="col-md-6">
              <div class="form-group mb-3">
                <label for="application_number">Application Number:</label>
                <div *ngIf="item.application_number" class="text-muted">{{ item.application_number }}</div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-group mb-3">
                <label for="application_number">Status:</label>
                <div *ngIf="item.application_number" class="text-muted">
                  <span class="badge rounded-pill" [ngClass]="{'bg-secondary':item.status_id==1,'bg-warning':item.status_id==2, 'bg-dark':item.status_id==3, 'bg-info':item.status_id==4, 'bg-success':item.status_id==5, 'bg-primary':item.status_id==6, 'bg-danger':item.status_id==7}">{{ item?.status?.name }}</span>
                </div>
              </div>
            </div>
            <div class="col-md-12">
              <div class="form-group mb-3">
                <label for="type_id">License Category:</label>
                <div *ngIf="item.category" class="text-muted">{{ item.category?.name }}</div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-group mb-3">
                <label for="financial_year" class="col-form-label required1">Year/Period:</label>
                <div *ngIf="item.financial_year" class="text-muted">{{ item.financial_year }}</div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-group mb-3">
                <label for="expiry_date">Expiry Date:</label>
                <div *ngIf="item.expiry_date" class="text-muted">{{ item.expiry_date | date }}</div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-group mb-3">
                <label for="type_id">License Type:</label>
                <div *ngIf="item.type" class="text-muted">{{ item.type?.name }}</div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-group mb-3">
                <label for="warehouse_receipt_number">Coffee Tasting Expert Certificate:</label>
                <div *ngIf="item.coffee_tasting_expert_certificate" class="text-muted1">
                  <a href="{{item.coffee_tasting_expert_certificate_url}}" target="_blank" class="btn btn-link btn-sm">File</a>
                </div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-group mb-3">
                <label for="coffee_species_id">Effective Date:</label>
                <div *ngIf="item.effective_date" class="text-muted">{{ item.effective_date | date }}</div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-group mb-3">
                <label for="coffee_form_id">Date of Gazettement Intent:</label>
                <div *ngIf="item.date_of_gazettement_intent" class="text-muted">{{ item.date_of_gazettement_intent | date }}</div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-group mb-3">
                <label for="payment">Payment:</label>
                <div *ngIf="item.payment" class="text-muted">
                  <span class="badge rounded-pill" [ngClass]="item.payment?.status_id===1 ? 'bg-danger':'bg-success'">{{ item.payment?.status.name }}</span>
                </div>
              </div>
            </div>
          </div>
          <div class="mt-3 text-end">
            <button routerLink="/licenses" class="btn btn-light">Cancel</button>
            <button [routerLink]="mAppContextService.hasTypes([1]) ? ['/licenses/process', item.id] : null" class="btn btn-warning">Process</button>
          </div>
        </div>

      </c-card-body>
    </c-card>
  </c-col>
</c-row>
