
<app-progress *ngIf="mProgress()" />

<section id="header">
  <nav class="navbar navbar-expand-lg shadow-lg bg-body fixed-top1" [class.fixed-top]="mIsFixed"[class.header-fixed]="mIsFixed">
    <div class="container">
        <a class="navbar-brand" routerLink="/">
          <img src="assets/images/logo-main.png" height="48"/>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav ms-auto">
            </ul>
            <ul class="navbar-nav mx-auto  fw-bolder">
              <li class="nav-item">
                  <a class="nav-link" routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
              </li>
              <li class="nav-item">
                  <a class="nav-link" routerLink="/home/details/standards" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Standards</a>
              </li>
              <li class="nav-item">
                  <a class="nav-link" routerLink="/home/details/how-it-works" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">How it Works</a>
              </li>
              <li class="nav-item">
                  <a class="nav-link" routerLink="/home/details/support" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Support</a>
              </li>
            </ul>
            <ul class="navbar-nav ms-auto">
              @if (!mCurrentUser) {
                <li class="nav-item">
                    <a class="nav-link me-2" routerLink="/auth/login">Login</a>
                </li>
                <li class="nav-item">
                    <a class="btn btn-warning" routerLink="/auth/register">Register</a>
                </li>
              }
              @if (mCurrentUser) {
                <li class="nav-item dropdown">
                  <a class="nav-link dropdown-toggle" data-bs-toggle="dropdown" href="#">Welcome, <span class="fw-bold">{{mCurrentUser.name}}</span></a>
                  <ul class="dropdown-menu">
                    <li><a class="dropdown-item" routerLink="/dashboard">Dashboard</a></li>
                    <li> <a (click)="onLogout()" class="dropdown-item">Logout</a></li>
                  </ul>
                </li>
              }
            </ul>
        </div>
    </div>
  </nav>
</section>
